<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Copys Creativos | Marketing Digital</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #ff758c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: none;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            max-width: 680px;
            width: 100%;
            overflow: hidden;
        }

        .card-header-custom {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        .card-header-custom h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .form-select {
            border-radius: 12px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.2);
        }

        .btn-generate {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
            color: white;
        }

        .result-box {
            background: #f8f9fa;
            border-left: 6px solid #ff7e5f;
            border-radius: 16px;
            padding: 24px;
            position: relative;
            display: none; /* Oculto inicialmente */
        }

        .copy-text {
            font-size: 1.15rem;
            color: #2d3748;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .badge-tag {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-card animate__animated animate__fadeInDown">
        <!-- Encabezado -->
        <div class="card-header-custom">
            <h1><i class="bi bi-stars"></i> Generador de Copys Creativos</h1>
            <p class="mb-0 opacity-90">Crea textos irresistibles para tus redes sociales en segundos</p>
        </div>

        <!-- Cuerpo de la aplicación -->
        <div class="card-body p-4 p-md-5">
            <div class="row g-3 mb-4">
                <!-- Selector Tipo de Publicación -->
                <div class="col-md-6">
                    <label for="tipoPublicacion" class="form-label fw-bold text-secondary">
                        <i class="bi bi-megaphone-fill text-primary"></i> Tipo de publicación
                    </label>
                    <select id="tipoPublicacion" class="form-select">
                        <option value="promocion">🔥 Promoción / Venta</option>
                        <option value="inspiracion">✨ Inspiración / Valor</option>
                        <option value="testimonial">💬 Testimonial / Prueba Social</option>
                        <option value="cta">🚀 Llamado a la acción (CTA)</option>
                    </select>
                </div>

                <!-- Selector Emoción -->
                <div class="col-md-6">
                    <label for="emocion" class="form-label fw-bold text-secondary">
                        <i class="bi bi-emoji-smile-fill text-warning"></i> Emoción a transmitir
                    </label>
                    <select id="emocion" class="form-select">
                        <option value="alegria">😄 Alegría y Entusiasmo</option>
                        <option value="urgencia">⏳ Urgencia / Escasez</option>
                        <option value="sorpresa">😲 Sorpresa / Curiosidad</option>
                        <option value="confianza">🤝 Confianza y Empatía</option>
                    </select>
                </div>
            </div>

            <!-- Botón Generar -->
            <div class="d-grid mb-4">
                <button id="btnGenerar" class="btn btn-generate">
                    <i class="bi bi-magic"></i> Generar Copy Creativo
                </button>
            </div>

            <!-- Contenedor del Resultado -->
            <div id="resultadoContenedor" class="result-box shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <span id="badgeTipo" class="badge bg-primary badge-tag me-1"></span>
                        <span id="badgeEmocion" class="badge bg-warning text-dark badge-tag"></span>
                    </div>
                    <button id="btnCopiar" class="btn btn-sm btn-outline-dark rounded-pill px-3" title="Copiar texto">
                        <i class="bi bi-clipboard"></i> Copiar
                    </button>
                </div>
                
                <p id="textoCopy" class="copy-text mt-3 mb-0"></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica JavaScript -->
    <script>
        // Base de datos de copys organizados por tipo y emoción
        const bancoCopys = {
            promocion: {
                alegria: [
                    "🎉 ¡Hoy es el día perfecto para consentirte! Llévate tu favorito con un 25% de descuento y empieza la semana con una sonrisa gigante. ✨🛍️",
                    "🌈 ¡Buenas noticias que alegran el día! Nuestros precios bajaron para que disfrutes lo que tanto querías sin culpas. ¡Aprovecha ya! 🥳"
                ],
                urgencia: [
                    "⏳ ¡Últimas horas! El reloj corre y nuestro descuento especial desaparece a medianoche. No digas que no te avisamos... ¡Corre al link de la bio! 🚨🔥",
                    "⚠️ Quedan menos de 10 unidades disponibles a precio especial. Una vez que se agoten, no volverán. ¡Asegura el tuyo ahora mismo! 🏃‍♂️💨"
                ],
                sorpresa: [
                    "😲 ¿Pensabas que lo habías visto todo? Espera a ver el regalo sorpresa que incluimos en todas las compras de hoy. ¡Te va a encantar! 🎁✨",
                    "🤯 ¡Plot twist! Bajamos los precios de nuestra colección estrella por tiempo limitado. Haz clic y descubre cuánto puedes ahorrar hoy. 👀"
                ],
                confianza: [
                    "🤝 Calidad comprobada al mejor precio del mercado. Miles de clientes ya dieron el paso, ahora te toca a ti disfrutar de esta oferta exclusiva. ✅",
                    "🛡️ Tu inversión más inteligente del mes: garantía total de satisfacción y un descuento especial diseñado pensando en ti. 💼✨"
                ]
            },
            inspiracion: {
                alegria: [
                    "☀️ Cada pequeño paso que das hoy está construyendo el éxito que celebrarás mañana. ¡Sigue brillando y nunca pierdas el entusiasmo! 🚀💛",
                    "🌟 La energía positiva es contagiosa. Haz eso que te apasiona y observa cómo todo a tu alrededor empieza a fluir. ¡Feliz día! ✨"
                ],
                urgencia: [
                    "⏰ El momento perfecto no existe, ¡lo creas tú hoy! Deja de posponer tus metas y da ese primer paso antes de que termine el día. 🔥",
                    "⚡ Dentro de un año desearás haber empezado hoy. No dejes pasar ni un minuto más para transformar tus ideas en realidad. 💡"
                ],
                sorpresa: [
                    "🦋 A veces el cambio más grande empieza con una decisión que parecía insignificante. ¿Qué pasaría si hoy te atreves a hacerlo diferente? ✨",
                    "💫 No subestimes el poder de reinventarte. Lo mejor de tu historia apenas está por escribirse y te va a sorprender. 📖🚀"
                ],
                confianza: [
                    "🌱 Confía en tu proceso. Incluso cuando no ves resultados inmediatos, estás echando raíces fuertes para todo lo bueno que viene. 🙌",
                    "💪 Tienes todo el talento y la capacidad para lograrlo. Respira hondo, enfócate y ve por ello; nosotros creemos en ti. ✨"
                ]
            },
            testimonial: {
                alegria: [
                    "😍 '¡Fue la mejor decisión que pude tomar! Me encantó desde el primer segundo.' — Historias reales de clientes felices que nos llenan el corazón. ❤️✨",
                    "🥳 Ver la sonrisa de nuestros clientes cuando reciben su pedido es nuestra mayor recompensa. ¡Gracias por dejarnos ser parte de su día! 🌟"
                ],
                urgencia: [
                    "🔥 'Me arrepiento de no haberlo comprado antes, me ahorró horas de trabajo.' — Únete hoy mismo a quienes ya están viendo resultados reales. ⏳",
                    "🚀 Cada día más personas están cambiando su rutina con nosotros. ¡No te quedes fuera de la conversación y pruébalo hoy! 💬"
                ],
                sorpresa: [
                    "😲 'Honestamente no esperaba que funcionara tan rápido, ¡superó todas mis expectativas!' — Así reaccionan quienes se animan a probarlo. ⭐",
                    "🤯 De tener dudas a convertirse en su favorito del día a día. Lee cómo nuestra comunidad está transformando sus resultados. 👇✨"
                ],
                confianza: [
                    "⭐⭐⭐⭐⭐ Más de 1,500 reseñas de 5 estrellas respaldan nuestro trabajo. Tu tranquilidad y satisfacción siempre son nuestra prioridad. 🤝",
                    "💬 'Excelente atención y calidad impecable.' Cuando haces las cosas con pasión, los resultados hablan por sí solos. ✅"
                ]
            },
            cta: {
                alegria: [
                    "👇 ¡Queremos leerte! Cuéntanos en los comentarios cuál es tu favorito y etiqueta a esa persona con la que compartirías esto. 💬😄",
                    "✨ ¿Listo para llevar tu experiencia al siguiente nivel? Toca el enlace en nuestro perfil y únete a esta gran comunidad. 🎉🚀"
                ],
                urgencia: [
                    "🚨 ¡No lo dejes para después! Haz clic en el botón de abajo ahora mismo y asegura tu lugar antes de que cerremos inscripciones. ⏳👇",
                    "⚡ Solo hoy: guarda este post para no perderlo y envíaselo a alguien que necesite verlo urgente. ¡Actúa ya! 📲🔥"
                ],
                sorpresa: [
                    "👀 ¿Quieres descubrir el secreto detrás de nuestros mejores resultados? Entra al link de la bio... ¡te sorprenderá lo que preparamos! 🎁",
                    "🤫 Tenemos algo exclusivo esperándote al otro lado de este clic. ¿Te atreves a descubrirlo? Ve a nuestras historias ahora. ✨"
                ],
                confianza: [
                    "📩 ¿Tienes dudas sobre cuál opción elegir? Escríbenos un mensaje directo y te asesoramos personalmente sin compromiso. 🤝💬",
                    "🔗 Haz clic en el enlace de nuestra biografía para conocer todos los detalles de forma clara, rápida y segura. ¡Te esperamos! ✅"
                ]
            }
        };

        // Nombres legibles para las etiquetas
        const etiquetasTipo = {
            promocion: "Promoción",
            inspiracion: "Inspiración",
            testimonial: "Testimonial",
            cta: "Llamado a la acción"
        };

        const etiquetasEmocion = {
            alegria: "Alegría",
            urgencia: "Urgencia",
            sorpresa: "Sorpresa",
            confianza: "Confianza"
        };

        // Elementos del DOM
        const btnGenerar = document.getElementById('btnGenerar');
        const btnCopiar = document.getElementById('btnCopiar');
        const selectTipo = document.getElementById('tipoPublicacion');
        const selectEmocion = document.getElementById('emocion');
        const resultadoContenedor = document.getElementById('resultadoContenedor');
        const textoCopy = document.getElementById('textoCopy');
        const badgeTipo = document.getElementById('badgeTipo');
        const badgeEmocion = document.getElementById('badgeEmocion');

        let ultimoCopy = "";

        // Función para generar copy aleatorio con animación
        btnGenerar.addEventListener('click', () => {
            const tipo = selectTipo.value;
            const emocion = selectEmocion.value;

            const opciones = bancoCopys[tipo][emocion];
            let copySeleccionado;

            // Evitar repetir exactamente el mismo copy seguido
            do {
                const indiceAleatorio = Math.floor(Math.random() * opciones.length);
                copySeleccionado = opciones[indiceAleatorio];
            } while (copySeleccionado === ultimoCopy && opciones.length > 1);

            ultimoCopy = copySeleccionado;

            // Actualizar contenido
            badgeTipo.textContent = etiquetasTipo[tipo];
            badgeEmocion.textContent = etiquetasEmocion[emocion];
            textoCopy.textContent = copySeleccionado;

            // Reiniciar animación de Animate.css
            resultadoContenedor.style.display = 'block';
            resultadoContenedor.classList.remove('animate__animated', 'animate__bounceIn');
            void resultadoContenedor.offsetWidth; // Truco para reiniciar el reflow CSS
            resultadoContenedor.classList.add('animate__animated', 'animate__bounceIn');

            // Restaurar botón de copiar
            btnCopiar.innerHTML = '<i class="bi bi-clipboard"></i> Copiar';
            btnCopiar.classList.replace('btn-success', 'btn-outline-dark');
        });

        // Función para copiar al portapapeles
        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(textoCopy.textContent).then(() => {
                btnCopiar.innerHTML = '<i class="bi bi-check2-circle"></i> ¡Copiado!';
                btnCopiar.classList.replace('btn-outline-dark', 'btn-success');
                
                setTimeout(() => {
                    btnCopiar.innerHTML = '<i class="bi bi-clipboard"></i> Copiar';
                    btnCopiar.classList.replace('btn-success', 'btn-outline-dark');
                }, 2000);
            });
        });
    </script>
</body>
</html>
